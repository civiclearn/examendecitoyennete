  <!-- ===============================

  ================================== -->

  <meta name="twitter:title" content="Contact – ExamenDeCitoyennete.ca">
  <meta name="twitter:description" content="Des questions sur la préparation à l’examen de citoyenneté canadienne ? Envoyez-nous un message.">
  <meta name="twitter:image" content="https://examendecitoyennete.ca/assets/images/og-default.jpg">

  <!-- ===============================
       JSON-LD STRUCTURED DATA
  ================================== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact – ExamenDeCitoyennete.ca",
    "description": "Page de contact pour le support lié à la préparation de l’examen de citoyenneté canadienne.",
    "url": "https://examendecitoyennete.ca/contact.html",
    "publisher": {
      "@type": "Organization",
      "name": "ExamenDeCitoyennete.ca",
      "logo": {
        "@type": "ImageObject",
        "url": "https://examendecitoyennete.ca/assets/images/ca.svg"
      }
    }
  }
  </script>

  <link rel="stylesheet" href="/assets/css/shared.css">
  <link rel="stylesheet" href="/assets/css/contact.css">

  <!-- Inline styles for success/error messages -->
  <style>
    .contact-feedback {
      display: none;
      margin-top: 1rem;
      font-size: 1rem;
      padding-left: 0.2rem;
    }
    .contact-feedback.success { color: #1b7f3b; }
    .contact-feedback.error { color: #b71c1c; }
  </style>

</head>

<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">

    <div class="header-left">
      <a href="/index.html" class="brand-link">
        <img src="/assets/images/ca.svg" alt="CA">
        <div class="brand-title">ExamenDeCitoyennete.ca</div>
      </a>
    </div>

    <div class="header-center">
      <nav class="header-nav">
        <a href="/test-gratuit.html">Test gratuit</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>

    <div class="header-right">
      <div class="brand-powered">propulsé par <span>CivicLearn</span></div>
      <a href="https://civiclearn.com/canadafr/checkout.html" class="btn-small-purple">Inscription</a>
    </div>

  </div>
</header>


<main class="contact-main">

  <h1 class="contact-title">Contact</h1>

  <div class="contact-card">

    <!-- AJAX CONTACT FORM -->
    <form id="contactForm" class="contact-form">

      <div class="field">
        <label>Nom*</label>
        <input type="text" name="name" required>
      </div>

      <div class="field">
        <label>E-mail*</label>
        <input type="email" name="_replyto" required>
      </div>

      <div class="field">
        <label>Message*</label>
        <textarea name="message" required></textarea>
      </div>

      <button type="submit" class="contact-submit">Envoyer le message</button>

      <!-- Success & error messages -->
      <div id="successMessage" class="contact-feedback success">
        Votre message a été envoyé.
      </div>

      <div id="errorMessage" class="contact-feedback error">
        Une erreur s’est produite. Veuillez réessayer.
      </div>

    </form>

  </div>

</main>

<footer class="cl-footer">
  <div class="cl-footer-inner">
    © 2025 <span class="cl-footer-brand">CivicLearn</span> — Tous droits réservés.
  </div>
</footer>


<!-- AJAX FORM SCRIPT -->
<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = e.target;
  const data = new FormData(form);

  const success = document.getElementById("successMessage");
  const error = document.getElementById("errorMessage");

  success.style.display = "none";
  error.style.display = "none";

  try {
    const response = await fetch("https://formspree.io/f/xzznjpaa", {
      method: "POST",
      body: data,
      headers: { "Accept": "application/json" }
    });

    if (response.ok) {
      success.style.display = "block";
      form.reset();
    } else {
      error.style.display = "block";
    }

  } catch {
    error.style.display = "block";
  }
});
</script>

</body>
</html>
